name: SuperDMZ Private Installer
description: Install SuperDMZ and manage its Windows service

inputs:
  token:
    description: SuperDMZ tunnel token
    required: true

outputs:
  service_name:
    description: Detected SuperDMZ Windows service name
    value: ${{ steps.install_service.outputs.service_name }}

  client_exe:
    description: Installed SuperDMZ client executable
    value: ${{ steps.install_service.outputs.client_exe }}

runs:
  using: composite

  steps:

    - name: Install SuperDMZ
      id: install_service
      shell: pwsh
      env:
        SUPERDMZ_TOKEN: ${{ inputs.token }}
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "[1/2] Installing SuperDMZ..." -ForegroundColor Cyan

        $setup = Join-Path `
            "${{ github.action_path }}" `
            "SuperDMZ.exe"

        $installDir = Join-Path `
            $env:RUNNER_TEMP `
            "SuperDMZ"

        if (-not (Test-Path $setup)) {
            throw "SuperDMZ.exe setup was not found."
        }

        if ([string]::IsNullOrWhiteSpace($env:SUPERDMZ_TOKEN)) {
            throw "SUPERDMZ_TOKEN is missing."
        }

        New-Item `
            -ItemType Directory `
            -Path $installDir `
            -Force |
            Out-Null

        $installer = Start-Process `
            -FilePath $setup `
            -ArgumentList @(
                "/VERYSILENT"
                "/SUPPRESSMSGBOXES"
                "/NORESTART"
                "/DIR=`"$installDir`""
            ) `
            -Wait `
            -PassThru

        Write-Host "[+] Installer exit code: $($installer.ExitCode)"

        if ($installer.ExitCode -ne 0) {
            throw "SuperDMZ installer failed. ExitCode=$($installer.ExitCode)"
        }

        Write-Host "[✓] Installer completed." -ForegroundColor Green

        Start-Sleep -Seconds 5


        # ----------------------------------------------------------
        # Find installed client executable
        # ----------------------------------------------------------

        Write-Host "[+] Searching installed SuperDMZ client..." -ForegroundColor Cyan

        $searchRoots = @(
            $installDir
            "C:\Program Files\SuperDMZ"
            "C:\Program Files (x86)\SuperDMZ"
            "$env:ProgramFiles\SuperDMZ"
            "${env:ProgramFiles(x86)}\SuperDMZ"
            "$env:LOCALAPPDATA\SuperDMZ"
            "$env:ProgramData\SuperDMZ"
        )

        $clientExe = $null

        foreach ($root in $searchRoots) {

            if (-not (Test-Path $root)) {
                continue
            }

            $candidate = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter "superdmz*.exe" `
                -ErrorAction SilentlyContinue |
                Where-Object {
                    $_.Name -notmatch "setup|unins"
                } |
                Select-Object -First 1

            if ($candidate) {
                $clientExe = $candidate.FullName
                break
            }
        }

        if (-not $clientExe) {
            throw "Installed SuperDMZ client executable was not found."
        }

        Write-Host "[✓] Client found:" -ForegroundColor Green
        Write-Host $clientExe


        # ----------------------------------------------------------
        # Find SuperDMZ Windows service
        # ----------------------------------------------------------

        Write-Host "[+] Searching SuperDMZ Windows service..." -ForegroundColor Cyan

        $service = $null

        $services = Get-CimInstance Win32_Service |
            Where-Object {
                $_.Name -match "SuperDMZ" -or
                $_.DisplayName -match "SuperDMZ" -or
                $_.PathName -match "superdmz-client"
            }

        if ($services) {
            $service = $services | Select-Object -First 1
        }

        if (-not $service) {

            Write-Host ""
            Write-Host "===== SERVICES FOUND =====" -ForegroundColor Yellow

            Get-CimInstance Win32_Service |
                Where-Object {
                    $_.PathName -match "SuperDMZ|superdmz"
                } |
                Select-Object Name, DisplayName, State, StartMode, PathName |
                Format-List

            throw "SuperDMZ Windows service was not found."
        }

        Write-Host "[✓] Service found." -ForegroundColor Green
        Write-Host "[+] Name: $($service.Name)"
        Write-Host "[+] DisplayName: $($service.DisplayName)"
        Write-Host "[+] State: $($service.State)"
        Write-Host "[+] Path: $($service.PathName)"


        # ----------------------------------------------------------
        # Start service if necessary
        # ----------------------------------------------------------

        $serviceObject = Get-Service `
            -Name $service.Name `
            -ErrorAction Stop

        if ($serviceObject.Status -ne "Running") {

            Write-Host "[+] Starting SuperDMZ service..." -ForegroundColor Cyan

            Start-Service `
                -Name $service.Name `
                -ErrorAction Stop

            Start-Sleep -Seconds 5
        }


        # ----------------------------------------------------------
        # Verify service
        # ----------------------------------------------------------

        $serviceObject = Get-Service `
            -Name $service.Name `
            -ErrorAction Stop

        if ($serviceObject.Status -ne "Running") {
            throw "SuperDMZ service is not running."
        }

        Write-Host "[✓] SuperDMZ service is RUNNING." -ForegroundColor Green


        # ----------------------------------------------------------
        # Return outputs to caller workflow
        # ----------------------------------------------------------

        "service_name=$($service.Name)" |
            Out-File `
                -FilePath $env:GITHUB_OUTPUT `
                -Append `
                -Encoding utf8

        "client_exe=$clientExe" |
            Out-File `
                -FilePath $env:GITHUB_OUTPUT `
                -Append `
                -Encoding utf8
