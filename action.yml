name: SuperDMZ Private Installer
description: Install and start the SuperDMZ Windows client

inputs:
  token:
    description: SuperDMZ tunnel token
    required: true

outputs:
  pid:
    description: SuperDMZ process ID
    value: ${{ steps.start_superdmz.outputs.pid }}

  exe:
    description: SuperDMZ client executable path
    value: ${{ steps.start_superdmz.outputs.exe }}

  out_log:
    description: SuperDMZ stdout log path
    value: ${{ steps.start_superdmz.outputs.out_log }}

  err_log:
    description: SuperDMZ stderr log path
    value: ${{ steps.start_superdmz.outputs.err_log }}

runs:
  using: composite

  steps:

    - name: Validate and Install SuperDMZ
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "[1/3] Validating SuperDMZ.exe..." -ForegroundColor Cyan

        $setup = Join-Path "${{ github.action_path }}" "SuperDMZ.exe"

        if (-not (Test-Path $setup)) {
            throw "SuperDMZ.exe was not found."
        }

        $file = Get-Item $setup

        Write-Host "[+] File: $($file.FullName)"
        Write-Host "[+] Size: $($file.Length) bytes"

        if ($file.Length -lt 1024) {
            throw "SuperDMZ.exe is suspiciously small."
        }

        $bytes = [System.IO.File]::ReadAllBytes($setup)

        if ($bytes.Length -lt 2) {
            throw "SuperDMZ.exe is too small."
        }

        $signature = [System.Text.Encoding]::ASCII.GetString(
            $bytes[0..1]
        )

        Write-Host "[+] Header: $signature"

        if ($signature -ne "MZ") {
            Write-Host ""
            Write-Host "===== FIRST BYTES =====" -ForegroundColor Yellow

            $previewLength = [Math]::Min(32, $bytes.Length)

            for ($i = 0; $i -lt $previewLength; $i++) {
                Write-Host -NoNewline (
                    "{0:X2} " -f $bytes[$i]
                )
            }

            Write-Host ""
            Write-Host ""
            throw "SuperDMZ.exe is NOT a valid Windows PE executable. The file is likely an LFS pointer or wrong file."
        }

        Write-Host "[✓] Windows PE header detected." -ForegroundColor Green


        Write-Host "[2/3] Installing SuperDMZ..." -ForegroundColor Cyan

        $installDir = Join-Path `
            $env:RUNNER_TEMP `
            "SuperDMZ"

        New-Item `
            -ItemType Directory `
            -Path $installDir `
            -Force |
            Out-Null

        $installer = Start-Process `
            -FilePath $setup `
            -ArgumentList @(
                "/VERYSILENT"
                "/SUPPRESSMSGBOXES"
                "/NORESTART"
                "/DIR=`"$installDir`""
            ) `
            -Wait `
            -PassThru

        if ($installer.ExitCode -ne 0) {
            throw "SuperDMZ installer failed. ExitCode=$($installer.ExitCode)"
        }

        Write-Host "[✓] Installer completed." -ForegroundColor Green

        Start-Sleep -Seconds 5


    - name: Find and Start SuperDMZ
      id: start_superdmz
      shell: pwsh
      env:
        SUPERDMZ_TOKEN: ${{ inputs.token }}
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "[3/3] Searching for installed SuperDMZ client..." -ForegroundColor Cyan

        $installDir = Join-Path `
            $env:RUNNER_TEMP `
            "SuperDMZ"

        $searchRoots = @(
            $installDir
            "C:\Program Files\SuperDMZ"
            "C:\Program Files (x86)\SuperDMZ"
            "$env:LOCALAPPDATA\SuperDMZ"
            "$env:ProgramData\SuperDMZ"
        )

        $clientExe = $null

        foreach ($root in $searchRoots) {

            if (-not (Test-Path $root)) {
                continue
            }

            $candidate = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter "*.exe" `
                -ErrorAction SilentlyContinue |
                Where-Object {
                    $_.Name -notmatch "setup|unins"
                } |
                Select-Object -First 1

            if ($candidate) {
                $clientExe = $candidate.FullName
                break
            }
        }

        if (-not $clientExe) {
            throw "Installed SuperDMZ client executable was not found."
        }

        Write-Host "[✓] Client found:" -ForegroundColor Green
        Write-Host $clientExe

        $clientBytes = [System.IO.File]::ReadAllBytes($clientExe)

        if ($clientBytes.Length -lt 2) {
            throw "Installed client is invalid."
        }

        $clientSignature = [System.Text.Encoding]::ASCII.GetString(
            $clientBytes[0..1]
        )

        if ($clientSignature -ne "MZ") {
            throw "Installed client is not a valid Windows PE executable."
        }

        $outLog = Join-Path `
            $env:RUNNER_TEMP `
            "superdmz-out.log"

        $errLog = Join-Path `
            $env:RUNNER_TEMP `
            "superdmz-err.log"

        New-Item `
            -ItemType File `
            -Path $outLog `
            -Force |
            Out-Null

        New-Item `
            -ItemType File `
            -Path $errLog `
            -Force |
            Out-Null

        Get-Process `
            -Name "SuperDMZ" `
            -ErrorAction SilentlyContinue |
            Stop-Process `
            -Force `
            -ErrorAction SilentlyContinue

        Write-Host "[+] Starting SuperDMZ client..." -ForegroundColor Cyan

        $process = Start-Process `
            -FilePath $clientExe `
            -ArgumentList "-token `"$($env:SUPERDMZ_TOKEN)`"" `
            -WorkingDirectory (Split-Path $clientExe) `
            -RedirectStandardOutput $outLog `
            -RedirectStandardError $errLog `
            -PassThru `
            -WindowStyle Hidden

        Start-Sleep -Seconds 5

        if ($process.HasExited) {

            Write-Host "[-] SuperDMZ exited immediately." -ForegroundColor Red
            Write-Host "ExitCode: $($process.ExitCode)" -ForegroundColor Red

            Write-Host ""
            Write-Host "===== STDOUT ====="

            if (Test-Path $outLog) {
                Get-Content $outLog
            }

            Write-Host ""
            Write-Host "===== STDERR ====="

            if (Test-Path $errLog) {
                Get-Content $errLog
            }

            throw "SuperDMZ client failed to stay running."
        }

        Write-Host "[✓] SuperDMZ client is running." -ForegroundColor Green
        Write-Host "[✓] PID: $($process.Id)" -ForegroundColor Green

        "pid=$($process.Id)" |
            Out-File $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

        "exe=$clientExe" |
            Out-File $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

        "out_log=$outLog" |
            Out-File $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

        "err_log=$errLog" |
            Out-File $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8
