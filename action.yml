name: SuperDMZ Private Installer
description: Install and start the SuperDMZ Windows client

inputs:
  token:
    description: SuperDMZ tunnel token
    required: true

outputs:
  pid:
    description: SuperDMZ process ID
    value: ${{ steps.start_superdmz.outputs.pid }}

  exe:
    description: SuperDMZ client executable path
    value: ${{ steps.start_superdmz.outputs.exe }}

  out_log:
    description: SuperDMZ stdout log path
    value: ${{ steps.start_superdmz.outputs.out_log }}

  err_log:
    description: SuperDMZ stderr log path
    value: ${{ steps.start_superdmz.outputs.err_log }}

runs:
  using: composite

  steps:

    - name: Install SuperDMZ
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "[1/2] Installing SuperDMZ..." -ForegroundColor Cyan

        $setup = Join-Path `
            "${{ github.action_path }}" `
            "SuperDMZ.exe"

        $installDir = Join-Path `
            $env:RUNNER_TEMP `
            "SuperDMZ"

        if (-not (Test-Path $setup)) {
            throw "SuperDMZ.exe setup was not found."
        }

        New-Item `
            -ItemType Directory `
            -Path $installDir `
            -Force |
            Out-Null

        $installer = Start-Process `
            -FilePath $setup `
            -ArgumentList @(
                "/VERYSILENT"
                "/SUPPRESSMSGBOXES"
                "/NORESTART"
                "/DIR=`"$installDir`""
            ) `
            -Wait `
            -PassThru

        if ($installer.ExitCode -ne 0) {
            throw "SuperDMZ installer failed. ExitCode=$($installer.ExitCode)"
        }

        Write-Host "[✓] Installer completed." -ForegroundColor Green

        Start-Sleep -Seconds 5


    - name: Find and Start SuperDMZ
      id: start_superdmz
      shell: pwsh
      env:
        SUPERDMZ_TOKEN: ${{ inputs.token }}
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "[2/2] Finding SuperDMZ client..." -ForegroundColor Cyan

        $installDir = Join-Path `
            $env:RUNNER_TEMP `
            "SuperDMZ"

        $searchRoots = @(
            $installDir
            "C:\Program Files\SuperDMZ"
            "C:\Program Files (x86)\SuperDMZ"
            "$env:LOCALAPPDATA\SuperDMZ"
            "$env:ProgramData\SuperDMZ"
        )

        $clientExe = $null

        foreach ($root in $searchRoots) {

            if (-not (Test-Path $root)) {
                continue
            }

            $candidate = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter "superdmz*.exe" `
                -ErrorAction SilentlyContinue |
                Where-Object {
                    $_.Name -notmatch "setup|unins"
                } |
                Select-Object -First 1

            if ($candidate) {
                $clientExe = $candidate.FullName
                break
            }
        }

        if (-not $clientExe) {
            throw "Installed SuperDMZ client executable was not found."
        }

        Write-Host "[✓] Client found:" -ForegroundColor Green
        Write-Host $clientExe -ForegroundColor Gray

        Get-Process `
            -Name "SuperDMZ" `
            -ErrorAction SilentlyContinue |
            Stop-Process `
            -Force `
            -ErrorAction SilentlyContinue

        $outLog = Join-Path `
            $env:RUNNER_TEMP `
            "superdmz-out.log"

        $errLog = Join-Path `
            $env:RUNNER_TEMP `
            "superdmz-err.log"

        New-Item `
            -ItemType File `
            -Path $outLog `
            -Force |
            Out-Null

        New-Item `
            -ItemType File `
            -Path $errLog `
            -Force |
            Out-Null

        Write-Host "[+] Starting SuperDMZ client..." -ForegroundColor Cyan

        $process = Start-Process `
            -FilePath $clientExe `
            -ArgumentList "-token `"$($env:SUPERDMZ_TOKEN)`"" `
            -WorkingDirectory (Split-Path $clientExe) `
            -RedirectStandardOutput $outLog `
            -RedirectStandardError $errLog `
            -PassThru `
            -WindowStyle Hidden

        Start-Sleep -Seconds 5

        if ($process.HasExited) {

            Write-Host "[-] SuperDMZ exited immediately." -ForegroundColor Red
            Write-Host "ExitCode: $($process.ExitCode)" -ForegroundColor Red

            Write-Host ""
            Write-Host "===== STDOUT ====="

            if (Test-Path $outLog) {
                Get-Content $outLog -ErrorAction SilentlyContinue
            }

            Write-Host ""
            Write-Host "===== STDERR ====="

            if (Test-Path $errLog) {
                Get-Content $errLog -ErrorAction SilentlyContinue
            }

            throw "SuperDMZ client failed to stay running."
        }

        Write-Host "[✓] SuperDMZ is running." -ForegroundColor Green
        Write-Host "[✓] PID: $($process.Id)" -ForegroundColor Green

        "pid=$($process.Id)" |
            Out-File `
                -FilePath $env:GITHUB_OUTPUT `
                -Append `
                -Encoding utf8

        "exe=$clientExe" |
            Out-File `
                -FilePath $env:GITHUB_OUTPUT `
                -Append `
                -Encoding utf8

        "out_log=$outLog" |
            Out-File `
                -FilePath $env:GITHUB_OUTPUT `
                -Append `
                -Encoding utf8

        "err_log=$errLog" |
            Out-File `
                -FilePath $env:GITHUB_OUTPUT `
                -Append `
                -Encoding utf8
