name: SuperDMZ Private Installer
description: Install SuperDMZ and keep its Windows service running

inputs:
  token:
    description: SuperDMZ tunnel token
    required: true

outputs:
  service_name:
    description: SuperDMZ Windows service name
    value: ${{ steps.install.outputs.service_name }}

  client_exe:
    description: Installed SuperDMZ client executable
    value: ${{ steps.install.outputs.client_exe }}

  tunnel_log:
    description: SuperDMZ output log
    value: ${{ steps.install.outputs.tunnel_log }}

runs:
  using: composite

  steps:
    - name: Install SuperDMZ and find service
      id: install
      shell: pwsh
      env:
        SUPERDMZ_TOKEN: ${{ inputs.token }}
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "[1/4] Preparing SuperDMZ..." -ForegroundColor Cyan

        $setup = Join-Path "${{ github.action_path }}" "SuperDMZ.exe"
        $installDir = Join-Path $env:RUNNER_TEMP "SuperDMZ"

        if (-not (Test-Path $setup)) {
          throw "SuperDMZ.exe setup was not found."
        }

        if ([string]::IsNullOrWhiteSpace($env:SUPERDMZ_TOKEN)) {
          throw "SUPERDMZ_TOKEN is missing."
        }

        New-Item `
          -ItemType Directory `
          -Path $installDir `
          -Force |
          Out-Null

        Write-Host "[2/4] Installing..." -ForegroundColor Cyan

        $installer = Start-Process `
          -FilePath $setup `
          -ArgumentList @(
            "/VERYSILENT"
            "/SUPPRESSMSGBOXES"
            "/NORESTART"
            "/DIR=`"$installDir`""
          ) `
          -Wait `
          -PassThru

        if ($installer.ExitCode -ne 0) {
          throw "Installer failed. ExitCode=$($installer.ExitCode)"
        }

        Write-Host "[✓] Installer completed." -ForegroundColor Green

        Start-Sleep -Seconds 5

        Write-Host "[3/4] Finding installed SuperDMZ client..." -ForegroundColor Cyan

        $searchRoots = @(
          $installDir
          "C:\Program Files\SuperDMZ"
          "C:\Program Files (x86)\SuperDMZ"
          "$env:ProgramData\SuperDMZ"
          "$env:LOCALAPPDATA\SuperDMZ"
        )

        $clientExe = $null

        foreach ($root in $searchRoots) {
          if (-not (Test-Path $root)) {
            continue
          }

          $candidate = Get-ChildItem `
            -Path $root `
            -Recurse `
            -File `
            -Filter "*.exe" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match "superdmz" -and
              $_.Name -notmatch "setup|unins"
            } |
            Select-Object -First 1

          if ($candidate) {
            $clientExe = $candidate.FullName
            break
          }
        }

        if (-not $clientExe) {
          throw "Installed SuperDMZ client was not found."
        }

        Write-Host "[✓] Client found: $clientExe" -ForegroundColor Green

        Write-Host "[4/4] Finding SuperDMZ Windows service..." -ForegroundColor Cyan

        $service = Get-CimInstance Win32_Service |
          Where-Object {
            $_.Name -match "SuperDMZ" -or
            $_.DisplayName -match "SuperDMZ" -or
            $_.PathName -match "superdmz"
          } |
          Select-Object -First 1

        if (-not $service) {
          throw "SuperDMZ Windows service was not found."
        }

        Write-Host "[✓] Service: $($service.Name)" -ForegroundColor Green
        Write-Host "[+] State: $($service.State)" -ForegroundColor Gray

        $serviceObject = Get-Service `
          -Name $service.Name `
          -ErrorAction Stop

        if ($serviceObject.Status -ne "Running") {
          Start-Service `
            -Name $service.Name `
            -ErrorAction Stop

          Start-Sleep -Seconds 5
        }

        $serviceObject = Get-Service `
          -Name $service.Name `
          -ErrorAction Stop

        if ($serviceObject.Status -ne "Running") {
          throw "SuperDMZ service failed to start."
        }

        # Service recovery: restart after failures
        & sc.exe failure $service.Name `
          reset= 86400 `
          actions= restart/5000/restart/10000/restart/30000 |
          Out-Null

        # Create log for service/client diagnostics
        $tunnelLog = Join-Path `
          $env:RUNNER_TEMP `
          "superdmz-service.log"

        New-Item `
          -ItemType File `
          -Path $tunnelLog `
          -Force |
          Out-Null

        "SuperDMZ service: $($service.Name)" |
          Out-File $tunnelLog -Append -Encoding utf8

        "Client: $clientExe" |
          Out-File $tunnelLog -Append -Encoding utf8

        "Status: $($serviceObject.Status)" |
          Out-File $tunnelLog -Append -Encoding utf8

        "service_name=$($service.Name)" |
          Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

        "client_exe=$clientExe" |
          Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

        "tunnel_log=$tunnelLog" |
          Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

        Write-Host "[✓] SuperDMZ service is RUNNING." -ForegroundColor Green
