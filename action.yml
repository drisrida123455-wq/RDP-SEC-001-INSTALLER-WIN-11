name: SuperDMZ Private Installer
description: Install SuperDMZ and return the installed client path

outputs:
  client_exe:
    description: Path to the installed SuperDMZ client
    value: ${{ steps.find_client.outputs.client_exe }}

runs:
  using: composite

  steps:

    - name: Install SuperDMZ
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "[1/2] Installing SuperDMZ..." -ForegroundColor Cyan

        $setup = Join-Path `
            "${{ github.action_path }}" `
            "SuperDMZ.exe"

        $installDir = Join-Path `
            $env:RUNNER_TEMP `
            "SuperDMZ"

        if (-not (Test-Path $setup)) {
            throw "SuperDMZ.exe was not found."
        }

        New-Item `
            -ItemType Directory `
            -Path $installDir `
            -Force |
            Out-Null

        Write-Host "[+] Running installer..." -ForegroundColor Cyan

        $installer = Start-Process `
            -FilePath $setup `
            -ArgumentList @(
                "/VERYSILENT"
                "/SUPPRESSMSGBOXES"
                "/NORESTART"
                "/DIR=`"$installDir`""
            ) `
            -Wait `
            -PassThru

        Write-Host "[+] Installer ExitCode: $($installer.ExitCode)"

        if ($installer.ExitCode -ne 0) {
            throw "SuperDMZ installer failed. ExitCode=$($installer.ExitCode)"
        }

        Write-Host "[✓] Installer completed." -ForegroundColor Green

        Start-Sleep -Seconds 5


    - name: Find SuperDMZ Client
      id: find_client
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        Write-Host "[2/2] Searching for SuperDMZ client..." -ForegroundColor Cyan

        $installDir = Join-Path `
            $env:RUNNER_TEMP `
            "SuperDMZ"

        $searchRoots = @(
            $installDir
            "C:\Program Files\SuperDMZ"
            "C:\Program Files (x86)\SuperDMZ"
            "$env:ProgramData\SuperDMZ"
            "$env:LOCALAPPDATA\SuperDMZ"
        )

        $clientExe = $null

        # First try the known client name.
        foreach ($root in $searchRoots) {

            if (-not (Test-Path $root)) {
                continue
            }

            $exact = Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter "superdmz-client.exe" `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

            if ($exact) {
                $clientExe = $exact.FullName
                break
            }
        }

        # Fallback search.
        if (-not $clientExe) {

            foreach ($root in $searchRoots) {

                if (-not (Test-Path $root)) {
                    continue
                }

                $candidate = Get-ChildItem `
                    -Path $root `
                    -Recurse `
                    -File `
                    -Filter "superdmz*.exe" `
                    -ErrorAction SilentlyContinue |
                    Where-Object {
                        $_.Name -notmatch "setup|unins"
                    } |
                    Select-Object -First 1

                if ($candidate) {
                    $clientExe = $candidate.FullName
                    break
                }
            }
        }

        if (-not $clientExe) {
            throw "Installed SuperDMZ client was not found."
        }

        Write-Host "[✓] Client found:" -ForegroundColor Green
        Write-Host $clientExe -ForegroundColor Gray

        "client_exe=$clientExe" |
            Out-File `
                -FilePath $env:GITHUB_OUTPUT `
                -Append `
                -Encoding utf8
